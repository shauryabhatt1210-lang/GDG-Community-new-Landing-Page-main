<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" fill="none">
  <defs>
    <linearGradient id="dfPstBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="50%" stop-color="#1E1B4B"/>
      <stop offset="100%" stop-color="#312E81"/>
    </linearGradient>
    <linearGradient id="gColorsGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#4285F4"/>
      <stop offset="33%" stop-color="#EA4335"/>
      <stop offset="66%" stop-color="#FBBC04"/>
      <stop offset="100%" stop-color="#34A853"/>
    </linearGradient>
  </defs>
  <rect width="640" height="360" fill="url(#dfPstBg)"/>

  <!-- Google 4-Color Accent Border Band -->
  <rect x="0" y="0" width="640" height="6" fill="url(#gColorsGrad)"/>

  <!-- Geometric Abstract Shapes -->
  <circle cx="100" cy="120" r="120" fill="#4285F4" opacity="0.15"/>
  <circle cx="540" cy="240" r="140" fill="#34A853" opacity="0.12"/>
  <circle cx="320" cy="320" r="100" fill="#FBBC04" opacity="0.1"/>

  <!-- Stage / Auditorium Spotlight Beam -->
  <path d="M 320 0 L 140 360 H 500 Z" fill="#6366F1" opacity="0.08"/>

  <!-- Conference Badge Header -->
  <g transform="translate(60, 45)">
    <rect width="170" height="30" rx="15" fill="#4285F4" opacity="0.2"/>
    <rect width="170" height="30" rx="15" stroke="#60A5FA" stroke-width="1.5" fill="none"/>
    <circle cx="16" cy="15" r="4" fill="#34D399"/>
    <text x="30" y="20" font-family="'Inter', sans-serif" font-size="11" font-weight="700" fill="#93C5FD">ANNUAL FLAGSHIP 2026</text>
  </g>

  <!-- DevFest Title -->
  <text x="60" y="130" font-family="'Google Sans', 'Inter', sans-serif" font-size="52" font-weight="900" fill="#FFFFFF" letter-spacing="-1">DevFest</text>
  <text x="260" y="130" font-family="'Google Sans', 'Inter', sans-serif" font-size="52" font-weight="900" fill="#FBBC04">2026</text>
  <text x="60" y="165" font-family="'Inter', sans-serif" font-size="18" font-weight="600" fill="#93C5FD">The AI &amp; Cloud Frontier • DevFest On Campus</text>

  <!-- Date & Venue Highlights -->
  <g transform="translate(60, 205)">
    <!-- Date Box -->
    <rect width="150" height="75" rx="12" fill="#1E293B" stroke="#475569" stroke-width="1.5"/>
    <text x="20" y="32" font-family="'Inter', sans-serif" font-size="11" font-weight="600" fill="#94A3B8">DATE</text>
    <text x="20" y="58" font-family="'Inter', sans-serif" font-size="18" font-weight="800" fill="#FFFFFF">NOV 28, 2026</text>

    <!-- Venue Box -->
    <rect x="170" width="180" height="75" rx="12" fill="#1E293B" stroke="#475569" stroke-width="1.5"/>
    <text x="190" y="32" font-family="'Inter', sans-serif" font-size="11" font-weight="600" fill="#94A3B8">VENUE</text>
    <text x="190" y="58" font-family="'Inter', sans-serif" font-size="16" font-weight="800" fill="#34D399">Main Auditorium</text>

    <!-- Keynote Box -->
    <rect x="370" width="150" height="75" rx="12" fill="#1E293B" stroke="#475569" stroke-width="1.5"/>
    <text x="390" y="32" font-family="'Inter', sans-serif" font-size="11" font-weight="600" fill="#94A3B8">SPEAKERS</text>
    <text x="390" y="58" font-family="'Inter', sans-serif" font-size="16" font-weight="800" fill="#F87171">8+ Experts</text>
  </g>

  <!-- Bottom Accent Tag -->
  <text x="60" y="325" font-family="'Inter', sans-serif" font-size="13" font-weight="600" fill="#CBD5E1">Keynotes • Hands-on Codelabs • Swag Bags • Official Certificates</text>
</svg>
