<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" fill="none">
  <defs>
    <linearGradient id="fhBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E1B4B"/>
      <stop offset="50%" stop-color="#312E81"/>
      <stop offset="100%" stop-color="#4338CA"/>
    </linearGradient>
  </defs>
  <rect width="640" height="360" fill="url(#fhBg)"/>

  <!-- Flutter Logo Graphics Right Side -->
  <g transform="translate(430, 80)">
    <path d="M 50 140 L 90 100 L 140 100 L 75 165 L 140 230 L 90 230 L 25 165 Z" fill="#38BDF8"/>
    <path d="M 90 100 L 140 50 H 90 L 40 100 Z" fill="#60A5FA"/>
    <!-- Trophy Symbol in hackathon -->
    <circle cx="95" cy="165" r="45" fill="#FBBF24" opacity="0.2"/>
    <text x="95" y="175" font-size="34" text-anchor="middle">🏆</text>
  </g>

  <!-- Tag Pill -->
  <g transform="translate(60, 45)">
    <rect width="210" height="30" rx="15" fill="#4338CA" stroke="#818CF8" stroke-width="1.5"/>
    <text x="105" y="20" font-family="'Inter', sans-serif" font-size="11" font-weight="700" fill="#E0E7FF" text-anchor="middle">24-HOUR CODING SPRINT</text>
  </g>

  <!-- Title -->
  <text x="60" y="125" font-family="'Google Sans', 'Inter', sans-serif" font-size="44" font-weight="900" fill="#FFFFFF">Flutter Forward</text>
  <text x="60" y="165" font-family="'Google Sans', 'Inter', sans-serif" font-size="36" font-weight="900" fill="#38BDF8">Campus Hackathon</text>
  <text x="60" y="198" font-family="'Inter', sans-serif" font-size="16" font-weight="500" fill="#C7D2FE">Build iOS, Android &amp; Web Apps • $3,000 Prize Pool</text>

  <!-- Metrics -->
  <g transform="translate(60, 230)">
    <rect width="140" height="55" rx="10" fill="#1E1B4B" stroke="#6366F1" stroke-width="1"/>
    <text x="20" y="24" font-family="'Inter', sans-serif" font-size="10" font-weight="600" fill="#A5B4FC">DATE</text>
    <text x="20" y="44" font-family="'Inter', sans-serif" font-size="14" font-weight="700" fill="#FFFFFF">Dec 5 - 6, 2026</text>

    <rect x="155" width="160" height="55" rx="10" fill="#1E1B4B" stroke="#6366F1" stroke-width="1"/>
    <text x="175" y="24" font-family="'Inter', sans-serif" font-size="10" font-weight="600" fill="#A5B4FC">FORMAT</text>
    <text x="175" y="44" font-family="'Inter', sans-serif" font-size="14" font-weight="700" fill="#FBBF24">24h In-Person &amp; Hybrid</text>
  </g>

  <text x="60" y="325" font-family="'Inter', sans-serif" font-size="12" font-weight="600" fill="#E0E7FF">Mentorship by GDEs • Fast-track Interviews • Free Midnight Food</text>
