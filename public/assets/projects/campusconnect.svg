<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" fill="none">
  <defs>
    <linearGradient id="mobBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#075985"/>
      <stop offset="50%" stop-color="#0369A1"/>
      <stop offset="100%" stop-color="#0284C7"/>
    </linearGradient>
  </defs>
  <rect width="640" height="360" fill="url(#mobBg)"/>

  <!-- Phone Frame in Center-Right -->
  <g transform="translate(380, 25)">
    <rect width="180" height="310" rx="30" fill="#0F172A" stroke="#38BDF8" stroke-width="4"/>
    <!-- Phone Screen -->
    <rect x="8" y="10" width="164" height="290" rx="22" fill="#1E293B"/>
    <!-- Dynamic Island / Camera -->
    <rect x="60" y="16" width="60" height="12" rx="6" fill="#0F172A"/>
    
    <!-- App UI Mockup -->
    <rect x="22" y="42" width="136" height="36" rx="8" fill="#0284C7"/>
    <text x="32" y="64" font-family="'Inter', sans-serif" font-size="11" font-weight="700" fill="#FFFFFF">GDG Tech Day 📅</text>
    
    <rect x="22" y="88" width="136" height="55" rx="10" fill="#334155"/>
    <circle cx="42" cy="115" r="14" fill="#38BDF8"/>
    <text x="64" y="112" font-family="'Inter', sans-serif" font-size="10" font-weight="700" fill="#FFFFFF">CS Study Jam</text>
    <text x="64" y="126" font-family="'Inter', sans-serif" font-size="8" fill="#94A3B8">Library Lab 4 • 4pm</text>

    <rect x="22" y="152" width="136" height="55" rx="10" fill="#334155"/>
    <circle cx="42" cy="179" r="14" fill="#4ADE80"/>
    <text x="64" y="176" font-family="'Inter', sans-serif" font-size="10" font-weight="700" fill="#FFFFFF">Cafeteria Menu</text>
    <text x="64" y="190" font-family="'Inter', sans-serif" font-size="8" fill="#94A3B8">Fresh Tacos & Bowls</text>

    <rect x="22" y="218" width="136" height="40" rx="8" fill="#0369A1"/>
    <text x="90" y="242" font-family="'Inter', sans-serif" font-size="10" font-weight="700" fill="#FFFFFF" text-anchor="middle">Join Group Chat</text>
  </g>

  <!-- Left Information & Badges -->
  <g transform="translate(50, 70)">
    <rect width="260" height="110" rx="14" fill="#0F172A" stroke="#38BDF8" stroke-width="1.5" opacity="0.9"/>
    <text x="24" y="34" font-family="'Inter', sans-serif" font-size="12" font-weight="600" fill="#7DD3FC">FLUTTER 3 + FIREBASE</text>
    <text x="24" y="66" font-family="'Inter', sans-serif" font-size="22" font-weight="800" fill="#FFFFFF">Campus SuperApp</text>
    <text x="24" y="92" font-family="'Inter', sans-serif" font-size="13" fill="#BAE6FD">8,200+ Active Students</text>
  </g>

  <!-- Flutter Bird Logo in Bottom Left -->
  <g transform="translate(60, 220)">
    <circle cx="35" cy="35" r="35" fill="#0284C7" stroke="#38BDF8" stroke-width="2"/>
    <path d="M 22 35 L 35 22 H 48 L 30 40 L 48 58 H 35 L 22 45 L 30 40 Z" fill="#FFFFFF"/>
    <text x="85" y="42" font-family="'Inter', sans-serif" font-size="15" font-weight="700" fill="#FFFFFF">Native 120 FPS</text>
  </g>
</svg>
