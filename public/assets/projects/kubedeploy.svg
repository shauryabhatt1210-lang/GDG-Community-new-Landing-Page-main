<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" fill="none">
  <defs>
    <linearGradient id="kubeBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="50%" stop-color="#1E293B"/>
      <stop offset="100%" stop-color="#0284C7"/>
    </linearGradient>
  </defs>
  <rect width="640" height="360" fill="url(#kubeBg)"/>

  <!-- Kubernetes Helm Wheel Symbol Center Right -->
  <g transform="translate(420, 150)" stroke="#38BDF8" stroke-width="4">
    <circle cx="60" cy="40" r="45" fill="#0F172A" stroke="#38BDF8" stroke-width="4"/>
    <circle cx="60" cy="40" r="16" fill="#38BDF8"/>
    <!-- Spokes -->
    <line x1="60" y1="-5" x2="60" y2="85"/>
    <line x1="20" y1="15" x2="100" y2="65"/>
    <line x1="20" y1="65" x2="100" y2="15"/>
  </g>

  <!-- Terminal Window on Left -->
  <g transform="translate(50, 40)">
    <rect width="360" height="280" rx="14" fill="#020617" stroke="#334155" stroke-width="2"/>
    <!-- Terminal Bar -->
    <rect width="360" height="36" rx="14" fill="#0F172A"/>
    <rect y="24" width="360" height="12" fill="#0F172A"/>
    <circle cx="20" cy="18" r="5" fill="#EF4444"/>
    <circle cx="36" cy="18" r="5" fill="#F59E0B"/>
    <circle cx="52" cy="18" r="5" fill="#10B981"/>
    <text x="130" y="22" font-family="'JetBrains Mono', monospace" font-size="11" fill="#94A3B8">kubedeploy-cli ~ go</text>

    <!-- Terminal Code lines -->
    <text x="24" y="70" font-family="'JetBrains Mono', monospace" font-size="12" fill="#38BDF8">$ kubedeploy up --cluster gke-student-prod</text>
    <text x="24" y="98" font-family="'JetBrains Mono', monospace" font-size="12" fill="#94A3B8">[1/4] Provisioning GKE Autopilot NodePool...</text>
    <text x="24" y="126" font-family="'JetBrains Mono', monospace" font-size="12" fill="#94A3B8">[2/4] Syncing Helm Chart templates...</text>
    <text x="24" y="154" font-family="'JetBrains Mono', monospace" font-size="12" fill="#94A3B8">[3/4] Ingress SSL Cert provisioned via GCP</text>
    <text x="24" y="182" font-family="'JetBrains Mono', monospace" font-size="12" fill="#4ADE80">[4/4] 🚀 Deployment Live: https://hack.app.gdg</text>

    <text x="24" y="224" font-family="'JetBrains Mono', monospace" font-size="12" fill="#FDE047">STATUS: 12 Pods Healthy (0 restarts)</text>
    <text x="24" y="250" font-family="'JetBrains Mono', monospace" font-size="12" fill="#E2E8F0">CPU: 8% | MEM: 412Mi | AutoScale: Ready</text>
  </g>
</svg>
