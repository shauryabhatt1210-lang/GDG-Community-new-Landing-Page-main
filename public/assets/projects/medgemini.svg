<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" fill="none">
  <defs>
    <linearGradient id="medBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E1B4B"/>
      <stop offset="50%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#312E81"/>
    </linearGradient>
    <linearGradient id="aiGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4285F4"/>
      <stop offset="50%" stop-color="#A855F7"/>
      <stop offset="100%" stop-color="#EC4899"/>
    </linearGradient>
  </defs>
  <rect width="640" height="360" fill="url(#medBg)"/>

  <!-- AI Neural Network Web -->
  <g stroke="#6366F1" stroke-width="1.5" opacity="0.4">
    <line x1="120" y1="180" x2="220" y2="100"/>
    <line x1="120" y1="180" x2="220" y2="260"/>
    <line x1="220" y1="100" x2="340" y2="80"/>
    <line x1="220" y1="100" x2="340" y2="180"/>
    <line x1="220" y1="260" x2="340" y2="180"/>
    <line x1="220" y1="260" x2="340" y2="280"/>
    <line x1="340" y1="80" x2="480" y2="140"/>
    <line x1="340" y1="180" x2="480" y2="140"/>
    <line x1="340" y1="280" x2="480" y2="220"/>
  </g>

  <!-- Glowing Nodes -->
  <circle cx="120" cy="180" r="10" fill="#4285F4"/>
  <circle cx="220" cy="100" r="9" fill="#818CF8"/>
  <circle cx="220" cy="260" r="9" fill="#C084FC"/>
  <circle cx="340" cy="80" r="12" fill="#EC4899"/>
  <circle cx="340" cy="180" r="14" fill="#38BDF8"/>
  <circle cx="340" cy="280" r="9" fill="#A855F7"/>
  <circle cx="480" cy="140" r="16" fill="url(#aiGlow)"/>
  <circle cx="480" cy="220" r="10" fill="#F43F5E"/>

  <!-- Gemini AI Sparkle Icon -->
  <g transform="translate(480, 140)">
    <path d="M 0 -22 Q 0 0 22 0 Q 0 0 0 22 Q 0 0 -22 0 Q 0 0 0 -22 Z" fill="#FFFFFF"/>
  </g>

  <!-- Heartbeat ECG line -->
  <path d="M 60 300 H 180 L 195 270 L 210 330 L 225 290 L 240 310 L 255 300 H 420" stroke="#F43F5E" stroke-width="3" stroke-linecap="round"/>

  <!-- Med Card Overlay -->
  <g transform="translate(60, 45)">
    <rect width="260" height="95" rx="14" fill="#0F172A" stroke="#6366F1" stroke-width="1.5" opacity="0.95"/>
    <text x="20" y="32" font-family="'Inter', sans-serif" font-size="12" font-weight="600" fill="#A5B4FC">MEDGEMINI 1.5 PRO</text>
    <text x="20" y="65" font-family="'Inter', sans-serif" font-size="22" font-weight="800" fill="#FFFFFF">Clinical Triage</text>
    <text x="20" y="85" font-family="'Inter', sans-serif" font-size="12" fill="#38BDF8">94.2% Diagnostic Extraction</text>
  </g>
</svg>
