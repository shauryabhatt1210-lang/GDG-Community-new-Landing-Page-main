<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" fill="none">
  <defs>
    <linearGradient id="dfBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E293B"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
  </defs>
  <rect width="640" height="360" fill="url(#dfBg)"/>

  <!-- Google 4-Color Accents -->
  <circle cx="560" cy="80" r="40" fill="#4285F4" opacity="0.25"/>
  <circle cx="500" cy="280" r="60" fill="#EA4335" opacity="0.2"/>

  <!-- PWA Mockup Tablet Interface -->
  <g transform="translate(180, 45)">
    <rect width="400" height="270" rx="16" fill="#1E293B" stroke="#475569" stroke-width="2"/>
    <!-- Top App Bar -->
    <rect width="400" height="45" rx="16" fill="#0F172A"/>
    <rect y="30" width="400" height="15" fill="#0F172A"/>
    <text x="24" y="28" font-family="'Inter', sans-serif" font-size="14" font-weight="700" fill="#FFFFFF">DevFest Schedule</text>
    <rect x="300" y="14" width="75" height="20" rx="10" fill="#34A853"/>
    <text x="337" y="28" font-family="'Inter', sans-serif" font-size="10" font-weight="700" fill="#FFFFFF" text-anchor="middle">OFFLINE READY</text>

    <!-- Schedule Item 1 -->
    <rect x="20" y="60" width="360" height="50" rx="8" fill="#334155"/>
    <text x="36" y="82" font-family="'Inter', sans-serif" font-size="11" font-weight="700" fill="#60A5FA">09:30 AM • Keynote Hall</text>
    <text x="36" y="98" font-family="'Inter', sans-serif" font-size="12" font-weight="500" fill="#FFFFFF">Keynote: Gemini 2.0 & The Future of Reasoning</text>

    <!-- Schedule Item 2 -->
    <rect x="20" y="120" width="360" height="50" rx="8" fill="#334155"/>
    <text x="36" y="142" font-family="'Inter', sans-serif" font-size="11" font-weight="700" fill="#FBBF24">11:00 AM • Workshop Track</text>
    <text x="36" y="158" font-family="'Inter', sans-serif" font-size="12" font-weight="500" fill="#FFFFFF">Building Real-Time Multimodal Agents</text>

    <!-- Schedule Item 3 -->
    <rect x="20" y="180" width="360" height="50" rx="8" fill="#334155"/>
    <text x="36" y="202" font-family="'Inter', sans-serif" font-size="11" font-weight="700" fill="#34D399">02:30 PM • Main Stage</text>
    <text x="36" y="218" font-family="'Inter', sans-serif" font-size="12" font-weight="500" fill="#FFFFFF">Lightning Talks & Student Innovation Demos</text>
  </g>

  <!-- Left Info Card -->
  <g transform="translate(30, 80)">
    <rect width="180" height="150" rx="12" fill="#0F172A" stroke="#38BDF8" stroke-width="1.5"/>
    <text x="16" y="32" font-family="'Inter', sans-serif" font-size="11" font-weight="700" fill="#38BDF8">PROGRESSIVE WEB APP</text>
    <text x="16" y="62" font-family="'Inter', sans-serif" font-size="18" font-weight="800" fill="#FFFFFF">DevFest Companion</text>
    <text x="16" y="88" font-family="'Inter', sans-serif" font-size="11" fill="#94A3B8">Interactive Booth</text>
    <text x="16" y="104" font-family="'Inter', sans-serif" font-size="11" fill="#94A3B8">Passports + Q&amp;A</text>
    <text x="16" y="130" font-family="'Inter', sans-serif" font-size="12" font-weight="700" fill="#34D399">1,200 Active Users</text>
  </g>
</svg>
