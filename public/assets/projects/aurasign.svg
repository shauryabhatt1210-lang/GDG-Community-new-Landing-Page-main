<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" fill="none">
  <defs>
    <linearGradient id="auraBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4C1D95"/>
      <stop offset="100%" stop-color="#1E1B4B"/>
    </linearGradient>
  </defs>
  <rect width="640" height="360" fill="url(#auraBg)"/>

  <!-- Computer Vision Hand Landmark Points -->
  <g stroke="#C084FC" stroke-width="2" stroke-linecap="round">
    <!-- Palm -->
    <path d="M 420 280 L 370 210 L 390 140 L 430 130 L 460 140 L 490 170 L 480 260 Z" fill="rgba(192, 132, 252, 0.15)"/>
    <!-- Fingers skeleton -->
    <line x1="390" y1="140" x2="380" y2="80"/>
    <line x1="430" y1="130" x2="430" y2="60"/>
    <line x1="460" y1="140" x2="470" y2="70"/>
    <line x1="490" y1="170" x2="520" y2="120"/>
    <line x1="370" y1="210" x2="320" y2="170"/>
  </g>

  <!-- Keypoints -->
  <circle cx="380" cy="80" r="6" fill="#38BDF8"/>
  <circle cx="430" cy="60" r="6" fill="#34D399"/>
  <circle cx="470" cy="70" r="6" fill="#F43F5E"/>
  <circle cx="520" cy="120" r="6" fill="#FBBF24"/>
  <circle cx="320" cy="170" r="6" fill="#C084FC"/>
  <circle cx="420" cy="280" r="8" fill="#FFFFFF"/>

  <!-- Bounding Box -->
  <rect x="300" y="45" width="240" height="260" rx="8" stroke="#38BDF8" stroke-width="2" stroke-dasharray="8 6" fill="none"/>
  <text x="310" y="38" font-family="'JetBrains Mono', monospace" font-size="12" fill="#38BDF8">ASL_GESTURE: "HELLO" [98.4%]</text>

  <!-- Left Info Card -->
  <g transform="translate(45, 80)">
    <rect width="230" height="130" rx="14" fill="#0F172A" stroke="#A855F7" stroke-width="1.5" opacity="0.95"/>
    <text x="20" y="32" font-family="'Inter', sans-serif" font-size="12" font-weight="600" fill="#D8B4FE">TENSORFLOW.JS + CV</text>
    <text x="20" y="65" font-family="'Inter', sans-serif" font-size="22" font-weight="800" fill="#FFFFFF">AuraSign</text>
    <text x="20" y="90" font-family="'Inter', sans-serif" font-size="13" fill="#E2E8F0">Client-Side ASL</text>
    <text x="20" y="112" font-family="'Inter', sans-serif" font-size="11" fill="#4ADE80">Zero Cloud Latency (14ms)</text>
  </g>
</svg>
